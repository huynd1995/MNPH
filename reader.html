<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bé Đọc Thơ Mầm Non</title>
  
  <!-- Google Fonts: Nunito & Quicksand -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- LZString for URL decompression -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>

  <style>
    :root {
      --primary: #4f46e5;
      --accent: #f59e0b;
      --bg-reader: #fef7ee;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(180deg, #fef3c7 0%, #fef7ee 20%, #f0fdf4 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 12px 12px 32px 12px;
    }

    .reader-container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-radius: 28px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 2px solid #fed7aa;
    }

    /* Top Bar */
    .reader-header {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #78350f;
    }

    .reader-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.85);
      padding: 4px 10px;
      border-radius: 20px;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 0.8rem;
    }

    .audio-btn {
      background: white;
      border: none;
      color: #d97706;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: transform 0.15s;
    }

    .audio-btn:active {
      transform: scale(0.92);
    }

    /* Illustration */
    .illustration-box {
      width: 100%;
      height: 240px;
      background: #f1f5f9;
      position: relative;
      overflow: hidden;
    }

    .illustration-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    /* Poem Content Section */
    .poem-body {
      padding: 24px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .poem-title {
      font-family: 'Quicksand', sans-serif;
      font-size: 1.85rem;
      font-weight: 800;
      color: #9a3412;
      line-height: 1.25;
      margin-bottom: 6px;
    }

    .poem-author {
      font-size: 0.95rem;
      color: #6b7280;
      font-weight: 600;
      margin-bottom: 20px;
      background: #fef2f2;
      color: #b91c1c;
      padding: 3px 12px;
      border-radius: 12px;
    }

    .poem-verses {
      font-family: 'Quicksand', 'Nunito', sans-serif;
      font-size: 1.25rem;
      line-height: 1.85;
      font-weight: 700;
      color: #1e293b;
      white-space: pre-line;
      text-align: center;
      background: #fbfdfe;
      border: 2px dashed #e2e8f0;
      border-radius: 20px;
      padding: 20px 16px;
      width: 100%;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
    }

    /* Actions Footer */
    .reader-footer {
      padding: 0 20px 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      border-radius: 14px;
      font-family: 'Quicksand', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-read-aloud {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      box-shadow: 0 4px 10px rgba(16, 185, 129, 0.25);
    }

    .btn-read-aloud.speaking {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      animation: pulse 1.5s infinite;
    }

    .btn-youtube {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
      box-shadow: 0 4px 10px rgba(239, 68, 68, 0.25);
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.75; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="reader-container">
    <!-- Header -->
    <div class="reader-header">
      <div class="reader-badge">
        <i data-lucide="sparkles" style="width: 16px; height: 16px; color: #f59e0b;"></i>
        <span>Bé Học Thơ Mầm Non</span>
      </div>
      <button class="audio-btn" id="headerAudioBtn" title="Đọc bài thơ">
        <i data-lucide="volume-2" style="width: 18px; height: 18px;"></i>
      </button>
    </div>

    <!-- Illustration Image -->
    <div class="illustration-box">
      <img id="poemImg" class="illustration-img" src="" alt="Tranh minh họa bài thơ">
    </div>

    <!-- Poem Content -->
    <div class="poem-body">
      <h1 class="poem-title" id="poemTitle">Đang nạp bài thơ...</h1>
      <div class="poem-author" id="poemAuthor">Tác giả</div>
      <div class="poem-verses" id="poemVerses"></div>
    </div>

    <!-- Actions -->
    <div class="reader-footer">
      <button class="action-btn btn-read-aloud" id="readAloudBtn">
        <i data-lucide="volume-2"></i>
        <span id="readAloudText">Đọc thơ cho bé nghe</span>
      </button>
      
      <a class="action-btn btn-youtube" id="youtubeBtn" href="#" target="_blank" style="display: none;">
        <i data-lucide="play-circle"></i>
        <span id="youtubeText">Nghe bài hát YouTube</span>
      </a>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/poems-data.js"></script>
  <script src="js/qr-engine.js"></script>
  <script>
    lucide.createIcons();

    let currentPoem = null;
    let isSpeaking = false;
    let speechSynth = window.speechSynthesis;

    function initReader() {
      currentPoem = QREngine.parseReaderUrl();

      if (!currentPoem) {
        document.getElementById('poemTitle').innerText = "Không tìm thấy bài thơ";
        document.getElementById('poemVerses').innerText = "Vui lòng quét lại mã QR.";
        return;
      }

      // Cập nhật DOM
      document.title = `Bài Thơ: ${currentPoem.title} - Mầm Non`;
      document.getElementById('poemTitle').innerText = currentPoem.title;
      document.getElementById('poemAuthor').innerText = currentPoem.author ? `Tác giả: ${currentPoem.author}` : 'Thơ Thiếu Nhi';
      document.getElementById('poemVerses').innerText = currentPoem.content;

      const imgEl = document.getElementById('poemImg');
      if (currentPoem.coverImage) {
        imgEl.src = currentPoem.coverImage;
      } else {
        imgEl.src = "https://images.unsplash.com/photo-1518780664697-55e3ad937233?auto=format&fit=crop&w=800&q=80";
      }

      // YouTube Link
      const ytBtn = document.getElementById('youtubeBtn');
      if (currentPoem.youtubeUrl) {
        ytBtn.href = currentPoem.youtubeUrl;
        ytBtn.style.display = 'flex';
        if (currentPoem.youtubeTitle) {
          document.getElementById('youtubeText').innerText = currentPoem.youtubeTitle;
        }
      } else {
        ytBtn.style.display = 'none';
      }

      lucide.createIcons();
    }

    // Tính năng đọc thơ bằng giọng đọc tiếng Việt
    function toggleSpeech() {
      if (!speechSynth) {
        alert("Trình duyệt không hỗ trợ đọc tự động.");
        return;
      }

      if (isSpeaking) {
        speechSynth.cancel();
        isSpeaking = false;
        updateSpeechBtn(false);
        return;
      }

      if (!currentPoem) return;

      const textToRead = `Bài thơ: ${currentPoem.title}. Tác giả: ${currentPoem.author || 'Sưu tầm'}. ${currentPoem.content}`;
      const utterance = new SpeechSynthesisUtterance(textToRead);
      utterance.lang = 'vi-VN';
      utterance.rate = 0.85; // Giọng đọc chậm rãi cho bé dễ nghe
      utterance.pitch = 1.1;

      // Tìm giọng tiếng Việt nếu có
      const voices = speechSynth.getVoices();
      const viVoice = voices.find(v => v.lang.includes('vi') || v.lang.includes('VN'));
      if (viVoice) utterance.voice = viVoice;

      utterance.onstart = () => {
        isSpeaking = true;
        updateSpeechBtn(true);
      };

      utterance.onend = () => {
        isSpeaking = false;
        updateSpeechBtn(false);
      };

      utterance.onerror = () => {
        isSpeaking = false;
        updateSpeechBtn(false);
      };

      speechSynth.speak(utterance);
    }

    function updateSpeechBtn(speaking) {
      const btn = document.getElementById('readAloudBtn');
      const text = document.getElementById('readAloudText');
      if (speaking) {
        btn.classList.add('speaking');
        text.innerText = "Dừng đọc thơ";
      } else {
        btn.classList.remove('speaking');
        text.innerText = "Đọc thơ cho bé nghe";
      }
    }

    document.getElementById('readAloudBtn').addEventListener('click', toggleSpeech);
    document.getElementById('headerAudioBtn').addEventListener('click', toggleSpeech);

    // Khởi tạo
    window.addEventListener('DOMContentLoaded', initReader);
  </script>
</body>
</html>
